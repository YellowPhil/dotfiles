# example window rules
# for windows named/classed as abc and xyz
windowrule=float,title:^(Welcome to Audacity\!)$
windowrule=float,wofi
windowrule=float,pavucontrol
windowrule=noblur,ffxiv*
windowrule = workspace 1 silent, ^(window)$

windowrule = fullscreen, wlogout
windowrule = float, title:wlogout
windowrule = fullscreen, title:wlogout

windowrulev2=float,class:,title:^(Picture-in-Picture)$
windowrulev2=pin,class:,title:^(Picture-in-Picture)$

windowrule = noblur,.*

windowrule = float, ^(steam)$
windowrule = float, ^(macchina)$ # FlafyDev/guifetch
windowrulev2 = tile,class:(libreoffice)


# Dialogs
windowrule=float,title:^(Open File)(.*)$
windowrule=float,title:^(Select a File)(.*)$
windowrule=float,title:^(Choose wallpaper)(.*)$
windowrule=float,title:^(Open Folder)(.*)$
windowrule=float,title:^(Save As)(.*)$
windowrule=float,title:^(Library)(.*)$

layerrule = xray 1, .*
#layerrule = noanim, .*
layerrule = noanim, selection
layerrule = noanim, overview
layerrule = blur, swaylock

layerrule = noanim, noanim
layerrule = blur, noanim
layerrule = blur, gtk-layer-shell
layerrule = ignorezero, gtk-layer-shell
layerrule = blur, launcher
layerrule = ignorealpha 0.5, launcher
layerrule = blur, notifications
layerrule = ignorealpha 0.69, notifications

# ags
layerrule = blur, session
layerrule = noanim, sideright
layerrule = noanim, sideleft

# rofi
windowrule=float,rofi
windowrule=animation popin,Rofi

# Increase the opacity 
windowrule=opacity 0.92,Thunar
# windowrule=opacity 0.96,discord
windowrule=opacity 0.88,obsidian
