import = [
    "~/.config/alacritty/themes/themes/thelovelace.toml"
]


live_config_reload = true
working_directory = "None"

[cursor]
style = {shape = "Block", blinking = "On"}

[shell]
program = "/usr/bin/zsh"

[window]
dynamic_padding = true
dynamic_title = true
opacity = 1
decorations = "Full"
padding = { x = 10, y = 10 }


[font]
size = 14

[font.bold]
family = "Fira Code"
style = "Bold"

[font.bold_italic]
family = "Iosevka Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.normal]
family = "Fira Code"
style = "Regular"

[font.offset]
x = 0
y = 0


[keyboard]
bindings = [ 
    {action = "SpawnNewInstance", key = "Return", mods = "Super" },
    {action = "Copy", key ="C", mods = "Control" },
    {action = "Paste", key = "V",mods = "Control"},
    {chars = "\u0003", key = "C", mods = "Control|Shift"},
    {chars = "\u0016", key = "V", mods = "Control|Shift"}
]
